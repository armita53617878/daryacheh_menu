<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کترینگ غذای دریاچه</title><style>@import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap");*{box-sizing:border-box}body{margin:0;background:#f7f2e9;color:#222;font-family:Vazirmatn,Tahoma,sans-serif}.hero{min-height:330px;background:linear-gradient(120deg,#122e27ee,#1b4438ee),url("https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1600&q=80") center/cover;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:35px 18px}.logo{width:92px;height:92px;border:1px solid #d6b678;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:34px}.hero h1{font-size:38px;margin:0;font-weight:800}.tag{margin:10px 0 20px;color:#ead7ae}.gold{height:2px;background:#c69b55;width:70px;margin:auto}.wrap{max-width:1050px;margin:auto;padding:25px 16px 45px}.top{background:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 35px #0000000b;margin-top:-40px;position:relative}.title{text-align:center;margin:0 0 15px;font-size:25px;color:#183b32}.cats{display:flex;gap:9px;overflow:auto;padding:4px}.cat{border:1px solid #ded6c8;background:#fff;color:#4b514c;padding:10px 17px;border-radius:30px;white-space:nowrap;font:inherit;cursor:pointer}.cat.active{background:#183b32;color:#fff;border-color:#183b32}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 9px 28px #0000000b}.photo{height:195px;background:#e9e4da}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:17px}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:19px;color:#183b32}.price{color:#a87832;font-weight:800}.desc{color:#777;font-size:13px;line-height:1.9;margin-top:7px}footer{text-align:center;padding:30px;color:#777;font-size:13px}@media(max-width:500px){.hero h1{font-size:30px}.grid{grid-template-columns:1fr}}</style></head><body><section class="hero"><div><div class="logo">د</div><h1>کترینگ غذای دریاچه</h1><div class="tag">طعم اصیل غذای ایرانی</div><div class="gold"></div></div></section><main class="wrap"><section class="top"><h2 class="title">منوی غذا</h2><div id="cats" class="cats"></div></section><section id="menu" class="grid"></section></main><footer>کترینگ غذای دریاچه<br>برای سفارش با ما در تماس باشید</footer><script>
const DATA_URL="https://docs.google.com/spreadsheets/d/1K0kcWJJbYRab9y5O6lo9kKE2F8r8V6BDffgaKVHpvWk/gviz/tq?tqx=out:json&sheet=Sheet1";
const demo=[{category:"خورشت",name:"قورمه‌سبزی",desc:"همراه برنج ایرانی",price:"—",image:"",day:""},{category:"خورشت",name:"قیمه",desc:"همراه برنج ایرانی",price:"—",image:"",day:""},{category:"چلو و غذا",name:"کباب کوبیده",desc:"دو سیخ کباب با برنج",price:"—",image:"",day:""},{category:"چلو و غذا",name:"جوجه کباب",desc:"جوجه زعفرانی با برنج",price:"—",image:"",day:""}];
let items=[];
const cats=document.getElementById("cats"), menu=document.getElementById("menu");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function render(){let c=[...new Set(items.map(x=>x.category).filter(Boolean))];cats.innerHTML='<button class="cat active" onclick="showCat(this,'همه')">همه</button>'+c.map(x=>`<button class="cat" onclick="showCat(this,${JSON.stringify(x)})">${esc(x)}</button>`).join("");show("همه")}
function showCat(b,c){document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");show(c)}
function show(c){let a=c==="همه"?items:items.filter(x=>x.category===c);menu.innerHTML=a.length?a.map(x=>`<article class="card"><div class="photo">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}">`:""}</div><div class="body"><div class="row"><div class="name">${esc(x.name)}</div><div class="price">${esc(x.price||"")}</div></div><div class="desc">${esc(x.desc||"")}${x.day?`<br><strong>روز: ${esc(x.day)}</strong>`:""}</div></div></article>`).join(""):"<div style='grid-column:1/-1;text-align:center;padding:40px;color:#777'>غذایی برای نمایش ثبت نشده است.</div>"}
async function load(){try{let r=await fetch(DATA_URL);if(!r.ok)throw new Error(r.status);let t=await r.text();let j=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));items=(j.table.rows||[]).map(row=>{let v=(row.c||[]).map(x=>x?.v??"");return{category:v[0],name:v[1],desc:v[2],price:v[3],image:v[4],day:v[5]}}).filter(x=>x.category||x.name);if(!items.length)items=demo}catch(e){console.error(e);items=demo}render()}load();
</script></body></html>
