<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کترینگ غذای دریاچه</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Vazirmatn,Tahoma,sans-serif;
  background:#f5f0e7;
  color:#26352c;
}

.hero{
  background:linear-gradient(135deg,#123c2d,#285b45);
  color:white;
  padding:38px 20px 42px;
  text-align:center;
}

.logo{
  width:88px;
  height:88px;
  margin:0 auto 15px;
  border:2px solid #d6b678;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:800;
  color:#d6b678;
}

.hero h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.hero p{
  margin:9px 0 0;
  color:#f0dfb7;
  font-size:16px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:25px 16px 45px;
}

.title{
  text-align:center;
  margin:0 0 18px;
  font-size:25px;
  color:#183b2b;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:4px 2px 15px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:0 0 auto;
  border:1px solid #d5c9b4;
  background:#fffdf8;
  color:#31503d;
  padding:10px 17px;
  border-radius:25px;
  font-family:inherit;
  font-size:14px;
  cursor:pointer;
}

.cat.active{
  background:#183b2b;
  color:white;
  border-color:#183b2b;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:16px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  border:1px solid #eee5d7;
}

.photo{
  width:100%;
  height:180px;
  background:linear-gradient(135deg,#e8dfcf,#f7f3eb);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9b8d76;
  font-size:42px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  padding:17px;
}

.card h3{
  margin:0 0 7px;
  color:#183b2b;
  font-size:19px;
}

.desc{
  color:#777;
  font-size:13px;
  line-height:1.8;
  min-height:24px;
}

.info{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:12px;
}

.price{
  color:#a87932;
  font-weight:800;
  font-size:17px;
}

.day{
  color:#666;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#777;
}

footer{
  text-align:center;
  padding:28px 15px;
  background:#183b2b;
  color:#ddd;
  font-size:13px;
  line-height:1.9;
}

.loading{
  text-align:center;
  padding:35px;
  color:#777;
}
</style>
</head>

<body>

<section class="hero">
  <div class="logo">د</div>
  <h1>کترینگ غذای دریاچه</h1>
  <p>طعم اصیل غذای ایرانی</p>
</section>

<main>

  <h2 class="title">منوی غذا</h2>

  <div id="categories" class="categories"></div>

  <div id="menu" class="grid">
    <div class="loading">در حال دریافت منو...</div>
  </div>

</main>

<footer>
  برای سفارش با ما در تماس باشید<br>
  کترینگ غذای دریاچه
</footer>

<script>

const DATA_URL =
"https://docs.google.com/spreadsheets/d/1K0kcWJJbYRab9y5O6lo9kKE2F8r8V6BDffgaKVHpvWk/gviz/tq?tqx=out:json";/spreadsheets/d/1K0kcWJJbYRab9y5O6lo9kKE2F8r8V6BDffgaKVHpvWk/gviz/tq?tqx=out:json&sheet=Sheet1";

const demo = [
  {
    category:"خورشت",
    name:"قورمه‌سبزی",
    desc:"همراه برنج ایرانی",
    price:"—",
    image:"",
    day:""
  },
  {
    category:"خورشت",
    name:"قیمه",
    desc:"همراه برنج ایرانی",
    price:"—",
    image:"",
    day:""
  },
  {
    category:"چلو و غذا",
    name:"کباب کوبیده",
    desc:"دو سیخ کباب با برنج",
    price:"—",
    image:"",
    day:""
  }
];

let items = [];
let currentCategory = "همه";

const categoriesEl = document.getElementById("categories");
const menuEl = document.getElementById("menu");

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderCategories(){

  const categories = [
    "همه",
    ...new Set(
      items
        .map(item => item.category)
        .filter(Boolean)
    )
  ];

  categoriesEl.innerHTML = "";

  categories.forEach(category => {

    const button = document.createElement("button");

    button.className =
      "cat" +
      (category === currentCategory ? " active" : "");

    button.textContent = category;

    button.addEventListener("click", () => {

      currentCategory = category;

      renderCategories();
      renderMenu();

    });

    categoriesEl.appendChild(button);

  });
}

function renderMenu(){

  let filtered = items;

  if(currentCategory !== "همه"){
    filtered = items.filter(
      item => item.category === currentCategory
    );
  }

  if(!filtered.length){

    menuEl.innerHTML =
      '<div class="empty">غذایی برای نمایش وجود ندارد.</div>';

    return;
  }

  menuEl.innerHTML = filtered.map(item => {

    const image = item.image
      ? `
        <div class="photo">
          <img
            src="${escapeHTML(item.image)}"
            alt="${escapeHTML(item.name)}"
            onerror="this.parentElement.innerHTML='🍽️'"
          >
        </div>
      `
      : `
        <div class="photo">🍽️</div>
